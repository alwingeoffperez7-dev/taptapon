<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TapTapon Points</title>
  <meta name="theme-color" content="#0F4A33">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Stencil+Display:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="field">
    <div class="field-inner">
      <div class="brandbar">
        <a class="brand" href="./">
          <img src="img/logo-mark.png" alt="" width="29" height="38">
          <span class="wordmark">Tap<b>Tapon</b></span>
        </a>
        <span class="tagline">I-Tap. I-Tapon. Ma-Reward.</span>
      </div>

      <form id="lookup" class="lookup">
        <label for="sid">Student number</label>
        <div class="inline">
          <input id="sid" inputmode="numeric" placeholder="2024-00123" autocomplete="off" required>
          <button class="btn-lime">Check</button>
        </div>
        <p id="lookup-msg" class="msg" role="status"></p>
      </form>

      <section class="score needs-student" aria-live="polite" hidden>
        <p class="who"><strong id="name"></strong> · <span id="sid-label" class="num"></span></p>
        <p class="points"><span id="points" class="stencil">0</span><span id="points-label" class="unit stencil">PTS</span></p>
        <div class="cap-head"><span>Earned today</span><strong id="today" class="num">0 / 20</strong></div>
        <div id="ticks" class="ticks" aria-hidden="true"></div>
        <p class="meta"><strong id="bottles">0 bottles</strong> recycled. Salamat sa pag-segregate!</p>
      </section>
    </div>
  </header>

  <main class="sheet">
    <section class="block needs-student" hidden>
      <h2>Rewards</h2>
      <div class="panel"><ul id="rewards" class="list"></ul></div>
    </section>

    <section class="block needs-student" hidden>
      <h2>My redemptions</h2>
      <div class="panel"><ul id="redemptions" class="list"></ul></div>
    </section>

    <section class="block needs-student" hidden>
      <h2>Recent deposits</h2>
      <div class="panel"><ul id="deposits" class="list"></ul></div>
    </section>

    <section class="block">
      <h2>Top 10 recyclers</h2>
      <div class="panel"><ol id="leaderboard" class="list"></ol></div>
    </section>
  </main>

  <script type="module" src="js/student.js"></script>
</body>
</html>
